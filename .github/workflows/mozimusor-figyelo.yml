name: Cinema City műsorfigyelő

# Ez a workflow a monorepo `mozimusor_figyelo/` alkönyvtárában dolgozik.
# Új projekthez: másold le ezt a fájlt más néven, és írd át a
# `working-directory` értékét meg a `concurrency.group`-ot.

on:
  schedule:
    # 15 percenként. Az 5 perc a GitHub által elfogadott minimum, de ingyenes
    # repóknál a nagyon sűrű ütemezéseket hátrasorolják, és a gyakorlatban el
    # sem indultak. A 15 perc megbízhatóbban lefut, és bőven elég: a mozi
    # hetente írja ki a műsort, nem percenként.
    #
    # A GitHub ütemezése amúgy sem pontos — nagy terhelésnél késik, néha ki is
    # hagy egy fordulót. Ez nem a mi hibánk, és nem is baj: az állapotot a
    # seen.json őrzi, tehát semmi nem vész el a kihagyott futáson.
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      force_report:
        description: "Írja ki a jelenlegi teljes állapotot"
        type: boolean
        default: false
      seed:
        description: "Állapot újrarögzítése értesítés nélkül"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: mozimusor-figyelo
  cancel-in-progress: false

defaults:
  run:
    working-directory: mozimusor_figyelo

jobs:
  watch:
    runs-on: ubuntu-latest

    # Mind opcionális. Ha nem állítod be, a watch.py tetején lévő CONFIG
    # blokk érvényes. Beállítani kódmódosítás nélkül itt lehet:
    #   Settings > Secrets and variables > Actions > Variables fül
    env:
      MOZI_NEVE: ${{ vars.MOZI_NEVE }}
      MOZI_SZAMA: ${{ vars.MOZI_SZAMA }}
      FILM_SZURO: ${{ vars.FILM_SZURO }}        # üres = minden filmre megy
      JELLEMZO_SZURO: ${{ vars.JELLEMZO_SZURO }} # üres = a CONFIG érvényes
      JEGYLINK: ${{ vars.JEGYLINK }}
      FULL_MIN_EVENTS: ${{ vars.FULL_MIN_EVENTS }}
      NOTIFY_PARTIAL: ${{ vars.NOTIFY_PARTIAL }}
      HORIZON_DAYS: ${{ vars.HORIZON_DAYS }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}     # opcionális mobil push

    steps:
      - uses: actions/checkout@v4

      - name: Figyelő futtatása
        id: run
        run: |
          set -o pipefail
          python3 watch.py --state state/seen.json \
            ${{ inputs.force_report && '--force-report' || '' }} \
            ${{ inputs.seed && '--seed' || '' }} \
            | tee /tmp/out.txt
          if grep -q '^=== ' /tmp/out.txt; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      # E-mail közvetlenül SMTP-vel, a saját Gmail-fiókodból.
      #
      # Miért nem GitHub-issue? Mert a GitHub a "watching" típusú értesítéseket
      # nem minden fióknál kézbesíti e-mailben (a webes értesítés megjelenik,
      # a levél nem), a hozzárendelés viszont két külön levelet váltana ki.
      # Ez így pontosan egy levél, a mi tárgysorunkkal.
      #
      # Beállítás:
      #   Settings > Secrets and variables > Actions
      #     Secrets   fül -> GMAIL_APP_PASSWORD  (16 karakteres Google app-jelszó)
      #     Variables fül -> GMAIL_USER          (a küldő Gmail-cím)
      #                      EMAIL_TO            (opcionális, ha máshova kéred)
      - name: Értesítés e-mailben
        id: notify
        if: steps.run.outputs.changed == 'yes'
        env:
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
        run: sed -n '/^=== /,$p' /tmp/out.txt | python3 notify_email.py

      # Az állapotot csak SIKERES értesítés után írjuk vissza. Ha a levél nem
      # ment el, a következő futás újrapróbálja ugyanazt — így nem nyelünk el
      # értesítést egy átmeneti SMTP-hiba miatt.
      # A pull --rebase azért kell, mert a monorepóban más projekt workflowja
      # is commitolhat ugyanabba a percbe.
      - name: Állapot visszaírása
        if: |
          always() && steps.run.outcome == 'success'
          && steps.notify.outcome != 'failure'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "mozimusor: state $(date -u '+%F %H:%M')"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break || sleep 5
            done
          fi

      - name: Összefoglaló
        if: always()
        run: cat /tmp/out.txt >> "$GITHUB_STEP_SUMMARY" || true
