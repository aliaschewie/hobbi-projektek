name: Mozi műsorfigyelő

# FIGYELEM: a FÁJL neve (mozimusor-figyelo.yml) nem változhat! A cron-job.org
# ezen a néven szólítja meg a GitHub API-ját:
#   …/actions/workflows/mozimusor-figyelo.yml/dispatches
# Ha átnevezed a fájlt, az ébresztő 404-et kap, és a figyelő némán leáll.
# A fenti `name:` viszont csak megjelenítési címke, azt bátran írhatod.
#
# Két figyelő fut egymás után, közös e-mail-küldővel:
#   watch.py  -> Cinema City Aréna   (JSON API)   [CCITY]
#   etele.py  -> Etele Cinema        (JSON API)   [ETELE]
#
# A Cinema MOM NEM itt fut, hanem a felhasználó Macén — lásd lentebb.
#
# Bármelyik kikapcsolható a saját fájlja tetején a FIGYELD = False sorral,
# vagy kód nélkül a FIGYELD_CCITY / FIGYELD_ETELE repo-változóval.
#
# A kettő független: ha az egyik elhasal, a másik akkor is lefut, és csak a
# sikeres figyelő állapota íródik vissza.

on:
  schedule:
    # A GitHub saját ütemezője ebben a repóban SOHA nem indult el (két és fél
    # óra */5-tel, háromnegyed óra */15-tel: nulla futás), pedig minden
    # beállítás rendben volt. Ezért a tényleges ébresztést a cron-job.org
    # végzi, ami workflow_dispatch-csal hívja ezt a workflow-t.
    # Ez a blokk tartaléknak marad: ha a GitHub egyszer mégis beindul, a
    # concurrency miatt nem futnak egymásra.
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      force_report:
        description: "Írja ki a jelenlegi teljes állapotot"
        type: boolean
        default: false
      seed:
        description: "Állapot újrarögzítése értesítés nélkül"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mozimusor-figyelo
  cancel-in-progress: false

defaults:
  run:
    working-directory: mozimusor_figyelo

jobs:
  watch:
    runs-on: ubuntu-latest

    env:
      # --- közös: e-mail ---
      GMAIL_USER: ${{ vars.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ vars.EMAIL_TO }}
      # Az üresen hagyott repo-változó NEM felülírás — a szkriptek CONFIG
      # blokkja marad érvényben. Szűrő kikapcsolásához "*"-ot kell írni.

    steps:
      - uses: actions/checkout@v4

      # ================= Cinema City =================
      - name: Cinema City figyelő
        id: ccity
        continue-on-error: true          # az Etele ettől függetlenül fusson
        env:
          FIGYELD: ${{ vars.FIGYELD_CCITY }}
          MOZI_NEVE: ${{ vars.MOZI_NEVE }}
          MOZI_SZAMA: ${{ vars.MOZI_SZAMA }}
          FILM_SZURO: ${{ vars.FILM_SZURO }}
          JELLEMZO_SZURO: ${{ vars.JELLEMZO_SZURO }}
          FULL_MIN_EVENTS: ${{ vars.FULL_MIN_EVENTS }}
          NOTIFY_PARTIAL: ${{ vars.NOTIFY_PARTIAL }}
          HORIZON_DAYS: ${{ vars.HORIZON_DAYS }}
        run: |
          set -o pipefail
          python3 watch.py --state state/seen.json \
            ${{ inputs.force_report && '--force-report' || '' }} \
            ${{ inputs.seed && '--seed' || '' }} \
            | tee /tmp/ccity.txt
          grep -q '^=== ' /tmp/ccity.txt \
            && echo "changed=yes" >> "$GITHUB_OUTPUT" \
            || echo "changed=no"  >> "$GITHUB_OUTPUT"

      - name: Cinema City értesítés
        id: ccity_mail
        if: steps.ccity.outputs.changed == 'yes'
        continue-on-error: true
        run: sed -n '/^=== /,$p' /tmp/ccity.txt | python3 notify_email.py

      # ================= Etele Cinema =================
      - name: Etele Cinema figyelő
        id: etele
        continue-on-error: true
        env:
          FIGYELD: ${{ vars.FIGYELD_ETELE }}
          FILM_SZURO: ${{ vars.ETELE_FILM_SZURO }}
          NYELV: ${{ vars.ETELE_NYELV }}
          JELLEMZO_SZURO: ${{ vars.ETELE_JELLEMZO_SZURO }}
        run: |
          set -o pipefail
          python3 etele.py --state state/etele.json \
            ${{ inputs.force_report && '--force-report' || '' }} \
            ${{ inputs.seed && '--seed' || '' }} \
            | tee /tmp/etele.txt
          grep -q '^=== ' /tmp/etele.txt \
            && echo "changed=yes" >> "$GITHUB_OUTPUT" \
            || echo "changed=no"  >> "$GITHUB_OUTPUT"

      - name: Etele Cinema értesítés
        id: etele_mail
        if: steps.etele.outputs.changed == 'yes'
        continue-on-error: true
        run: sed -n '/^=== /,$p' /tmp/etele.txt | python3 notify_email.py

      # A Cinema MOM NEM itt fut, hanem a felhasználó Macén (launchd), mert a
      # cinemamom.hu az adatközponti IP-ket egy JavaScript-ellenőrző oldalra
      # irányítja a műsor helyett. Részletek: mozimusor_figyelo/HELYI-MOM.md

      # ================= heti életjel =================
      # Hetente egy rövid levél arról, hogy a rendszer fut. A levél ELMARADÁSA
      # a riasztás: e nélkül a leállás pontosan úgy nézne ki, mint amikor
      # nincs új vetítés. Nem kér le semmit a hálózatról, a két állapotfájlból
      # dolgozik — ha megérkezik, az bizonyítja, hogy az ébresztő, a workflow
      # és az e-mail-küldés is működik.
      - name: Heti életjel
        id: eletjel
        continue-on-error: true
        env:
          ELETJEL: ${{ vars.ELETJEL }}
          ELETJEL_NAPOK: ${{ vars.ELETJEL_NAPOK }}
        run: |
          set -o pipefail
          python3 eletjel.py --state state/eletjel.json | tee /tmp/eletjel.txt
          grep -q '^=== ' /tmp/eletjel.txt \
            && echo "changed=yes" >> "$GITHUB_OUTPUT" \
            || echo "changed=no"  >> "$GITHUB_OUTPUT"

      - name: Életjel értesítés
        id: eletjel_mail
        if: steps.eletjel.outputs.changed == 'yes'
        continue-on-error: true
        run: sed -n '/^=== /,$p' /tmp/eletjel.txt | python3 notify_email.py

      # ================= állapot =================
      # Figyelőnként külön döntünk: csak annak az állapotát írjuk vissza,
      # amelyiknél a lekérdezés ÉS az értesítés is rendben lement. Így ha egy
      # levél nem ment el, a következő futás újrapróbálja ugyanazt — nem
      # nyelünk el értesítést.
      - name: Állapot visszaírása
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A `|| true` azert kell, mert egy meg nem letezo allapotfajlra a
          # `git add` hibara fut, es a lepes `bash -e`-vel megy — attol az
          # egesz allapotmentes elhasalna.
          if [ "${{ steps.ccity.outcome }}" = "success" ] \
             && [ "${{ steps.ccity_mail.outcome }}" != "failure" ]; then
            git add state/seen.json 2>/dev/null || true
          fi
          if [ "${{ steps.etele.outcome }}" = "success" ] \
             && [ "${{ steps.etele_mail.outcome }}" != "failure" ]; then
            git add state/etele.json 2>/dev/null || true
          fi
          # Az életjel dátumát csak akkor rögzítjük, ha a levele el is ment —
          # különben egy sikertelen küldés után egy hetet várnánk a következőre.
          if [ "${{ steps.eletjel_mail.outcome }}" != "failure" ]; then
            git add state/eletjel.json 2>/dev/null || true
          fi
          # A meta-fajlokat (hibaszamlalo, ETag) mindig visszairjuk: azok epp akkor
          # fontosak, amikor a figyelo NEM futott le rendben.
          git add state/seen_meta.json state/etele_meta.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "mozimusor: state $(date -u '+%F %H:%M')"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break || sleep 5
            done
          fi

      - name: Összefoglaló
        if: always()
        run: |
          {
            echo '## Cinema City'
            echo '```'; cat /tmp/ccity.txt  2>/dev/null || echo '(nem futott)'; echo '```'
            echo '## Etele Cinema'
            echo '```'; cat /tmp/etele.txt  2>/dev/null || echo '(nem futott)'; echo '```'
            echo '## Heti életjel'
            echo '```'; cat /tmp/eletjel.txt 2>/dev/null || echo '(nem futott)'; echo '```'
            echo '_A Cinema MOM a felhasználó Macén fut, nem itt — HELYI-MOM.md_'
          } >> "$GITHUB_STEP_SUMMARY"

      # A figyelőkön `continue-on-error` van, hogy egyik se akadályozza a
      # másikat — de a futás akkor is legyen PIROS, ha valamelyik elhasalt.
      # Enélkül egy elromlott értelmező zöld pipával, észrevétlenül maradna.
      - name: Hibák jelzése
        if: always()
        run: |
          hiba=0
          if [ "${{ steps.ccity.outcome }}" = "failure" ]; then
            echo "::error::A Cinema City figyelő elhasalt"; hiba=1
          fi
          if [ "${{ steps.etele.outcome }}" = "failure" ]; then
            echo "::error::Az Etele Cinema figyelő elhasalt (lehet, hogy átalakult az API)"; hiba=1
          fi
          if [ "${{ steps.eletjel.outcome }}" = "failure" ]; then
            echo "::error::A heti életjel elhasalt"; hiba=1
          fi
          if [ "${{ steps.ccity_mail.outcome }}" = "failure" ] \
             || [ "${{ steps.etele_mail.outcome }}" = "failure" ] \
             || [ "${{ steps.eletjel_mail.outcome }}" = "failure" ]; then
            echo "::error::E-mail küldés sikertelen"; hiba=1
          fi
          exit $hiba
